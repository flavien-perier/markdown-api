[package]
name = "markdown_api"
version = "1.0.0"
edition = "2024"

description = "Markdown API"
license = "MIT"
repository = "https://github.com/flavien-perier/markdown-api"
homepage = "https://github.com/flavien-perier/markdown-api"
keywords = ["markdown", "api"]
authors = ["Flavien Perier <perier@flavien.io>"]

[dependencies]
axum = "0.8.9"
tokio = { version = "1.54.1", features = ["full"] }
serde = { version = "1.0.229", features = ["derive"] }
serde-saphyr = "2.2.0"
tracing = "0.1.44"
regex = "1.13.2"
tracing-subscriber = "0.3.23"
tower-http = { version = "0.7.1", features = ["cors"] }
jiff = "1.0.3"
